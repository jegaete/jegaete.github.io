name: Update citation metrics

on:
  schedule:
    - cron: '30 6 1 * *'   # día 1 de cada mes, 06:30 UTC (después de la sync de ORCID)
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

concurrency:
  group: sync-orcid
  cancel-in-progress: false

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch metrics from OpenAlex
        shell: python
        run: |
          import datetime, json, urllib.request

          url = ("https://api.openalex.org/authors/https://orcid.org/0000-0002-6650-6018"
                 "?select=cited_by_count,summary_stats,counts_by_year")
          req = urllib.request.Request(url, headers={"User-Agent": "metrics-updater/1.0 (mailto:jgaete@uandes.cl)"})
          with urllib.request.urlopen(req, timeout=30) as r:
              d = json.loads(r.read())

          cited = d["cited_by_count"]
          h = d["summary_stats"]["h_index"]
          i10 = d["summary_stats"]["i10_index"]
          year = datetime.date.today().year
          last5 = sum(y["cited_by_count"] for y in d["counts_by_year"] if y["year"] >= year - 5)
          today = datetime.date.today().isoformat()

          lines = [
              "# Métricas de citación — actualizadas automáticamente desde OpenAlex",
              "# Fuente: https://api.openalex.org/authors/https://orcid.org/0000-0002-6650-6018",
              "# Nota: OpenAlex indexa principalmente publicaciones en acceso abierto;",
              "#        los números son menores que Google Scholar pero se actualizan solos.",
              "",
              f"cited_by_count: {cited}",
              f"h_index: {h}",
              f"i10_index: {i10}",
              f"cited_last5: {last5}",
              f'last_updated: "{today}"',
          ]
          with open("_data/metrics.yml", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(f"Actualizado: citas={cited}, h={h}, i10={i10}, últimos 5 años={last5}")

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/metrics.yml
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "chore: actualizar métricas de citas desde OpenAlex"
            git pull --rebase
            git push
          fi
