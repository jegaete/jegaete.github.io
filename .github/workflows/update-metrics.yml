name: Update citation metrics

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch metrics from OpenAlex
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, datetime

          url = 'https://api.openalex.org/authors/https://orcid.org/0000-0002-6650-6018?select=cited_by_count,summary_stats,counts_by_year'
          req = urllib.request.Request(url, headers={'User-Agent': 'metrics-updater/1.0 (mailto:jgaete@uandes.cl)'})
          with urllib.request.urlopen(req) as r:
              d = json.loads(r.read())

          cited = d['cited_by_count']
          h = d['summary_stats']['h_index']
          i10 = d['summary_stats']['i10_index']

          current_year = datetime.date.today().year
          last5 = [y['cited_by_count'] for y in d['counts_by_year'] if y['year'] >= current_year - 5]
          citas5 = sum(last5)
          today = datetime.date.today().strftime('%Y-%m-%d')

          yaml_content = f"""# Métricas de citación — actualizadas automáticamente desde OpenAlex
# Fuente: https://api.openalex.org/authors/https://orcid.org/0000-0002-6650-6018
cited_by_count: {cited}
h_index: {h}
i10_index: {i10}
cited_last5: {citas5}
last_updated: "{today}"
"""
          with open('_data/metrics.yml', 'w') as f:
              f.write(yaml_content)
          print(f"Updated: citas={cited}, h={h}, i10={i10}, last5={citas5}")
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/metrics.yml
          git diff --cached --quiet || git commit -m "chore: auto-update citation metrics [skip ci]"
          git push
