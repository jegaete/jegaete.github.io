# Configuración de la sincronización de publicaciones desde ORCID
# (lo usa .github/scripts/sync_orcid_publications.py).
#
# La lista de publicaciones del sitio (_data/publications.yml) se regenera
# automáticamente cada mes desde ORCID. Para cambiar lo que se muestra,
# lo ideal es corregir el registro en ORCID. Si algo no se puede corregir
# allí, usar este archivo.

# Tipos de trabajo de ORCID que no se muestran.
exclude_types:
  - preprint

# Trabajos de ORCID que no se muestran (put-code de ORCID).
exclude_put_codes:
  # Resúmenes de congreso (European Psychiatry)
  - 12861322   # 2012 · The association between personal, familial, school and peer factors and smoking…
  - 12861324   # 2010 · The association between school bonding and smoking amongst adolescents…
  # Duplicados en inglés (sin DOI) de artículos de Rev Med Chile que ya aparecen con DOI
  - 13240863   # 2014 · Factors associated with health promoting behaviors… (= "Factores asociados a conductas promotoras de salud…")
  - 24653434   # 2016 · Smoking and alcohol use among Chilean teenagers… (= "Consumo de tabaco y alcohol en adolescentes de 10 a 14 años…")
  - 27863259   # 2016 · The influence of parental healthy behaviors… (= "Influencia de las conductas promotoras de salud de los padres…")

# DOI que no se muestran (opcional).
exclude_dois: []

# Autores corregidos a mano cuando Crossref tiene la lista incompleta.
# DOI -> autores en orden ("Apellido, Iniciales").
author_overrides:
  # La lista original omitió a J. Gaete; se corrigió con una fe de erratas (10.1186/1471-244X-13-269).
  "10.1186/1471-244x-13-122":
    - "Araya, R."
    - "Montero-Marin, J."
    - "Barroilhet, S."
    - "Fritsch, R."
    - "Gaete, J."
    - "Montgomery, A."

# Publicaciones que no están en ORCID y se agregan a mano.
# authors: "Apellido, Nombre" (o iniciales), en orden.
manual:
  - title: "The mediating role of psychological inflexibility between psychotic experiences and mental well-being in university students"
    authors:
      - "Yáñez Lizana, J."
      - "Fuentes Ferrada, R."
      - "Núñez, D."
      - "Martínez, V."
      - "Gaete, J."
      - "Mac-Ginty, S."
      - "Langer, A. I."
    year: 2026
    month: 3
    journal: "International Journal of Psychology & Psychological Therapy"
    volume: 26
    issue: 1
    pages: "79-92"
    url: "https://www.ijpsy.com"
